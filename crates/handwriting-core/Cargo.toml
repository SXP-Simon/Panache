[package]
name = "handwriting-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
imageproc = { version = "0.27.0", default-features = false }
pdf-extract = "0.12.1"
pdf-writer = "0.15.0"
quick-xml = "0.42.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { workspace = true, features = ["derive"] }
thiserror = "2.0.21"
ttf-parser = "0.25.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
