services:
  handwriting:
    build:
      context: ../..
      dockerfile: deploy/rust/Dockerfile
    ports:
      - "127.0.0.1:5006:5006"
    environment:
      HANDWRITING_ACCESS_TOKEN: "${HANDWRITING_ACCESS_TOKEN:?请配置至少 32 字节的访问令牌}"
      HANDWRITING_ALLOWED_ORIGINS: "${HANDWRITING_ALLOWED_ORIGINS:-http://127.0.0.1:5006,http://localhost:5006}"
    volumes:
      - handwriting-rust:/data
    restart: unless-stopped
volumes:
  handwriting-rust:
