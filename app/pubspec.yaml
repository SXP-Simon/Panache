name: handwriting_app
description: Panache 手写体生成工具的跨平台 Flutter 客户端。
publish_to: none

# 开发脚手架版本；产品版本由根目录 VERSION 提供。
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  web: ^1.1.1
  http: ^1.6.0
  ffi: ^2.1.4
  handwriting_assets:
    path: ../assets
  file_picker: ^10.3.10
  file_saver: ^0.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_math_fork: ^0.7.4
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/panache.png
