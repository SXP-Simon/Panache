# 发版后自动构建 Windows / macOS 桌面版，并把安装包挂到对应的 GitHub Release 上。
#
# 为什么用 workflow_run 而不是 release: published / push: tags：
# semantic-release 是用 token 创建 release 的，而 token 触发的 push / release 事件
# 默认不会再触发新的工作流（GitHub 防递归）。workflow_run 以「另一个工作流跑完」
# 为触发条件，不受该限制，所以不依赖 secrets.GH_TOKEN 是不是 PAT 都能生效。
#
# 前提：本文件必须在默认分支上才会被 workflow_run 触发。
name: Desktop Release Assets

on:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
    branches: [custom-base]
  # 手动补传历史版本：Actions 页面 Run workflow，填上 tag
  workflow_dispatch:
    inputs:
      tag:
        description: 要补传产物的 tag（例如 v1.31.0）
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # 先把「这次要不要构建、构建哪个版本、要不要出 mac 包」在一个便宜的 ubuntu runner 上
  # 定下来，两个构建 job 只消费它的输出。拆出来是为了让「本次没发版」和「旧 tag 不支持
  # macOS」这两条路径都不去启动对应的 runner —— macOS 的计费倍率是 Linux 的 10 倍。
  resolve-tag:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'custom-base'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      mac_supported: ${{ steps.mac.outputs.supported }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 手动补传时必须检出那个 tag 的代码：否则会拿 custom-base 的最新代码构建、
          # 再挂到旧 release 上，产物的版本号和 release 对不上。
          ref: ${{ inputs.tag || 'custom-base' }}
          # contents: write 的 token 不该留在 git config 里供后续脚本读取。
          # gh 步骤用的是显式传的 GH_TOKEN。
          persist-credentials: false

      - name: 查找本次发布结果
        id: result
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "release-result" and .expired == false)] | length')"
          if [ "$COUNT" = "0" ]; then
            echo "本次没有发布结果，跳过桌面版构建"
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" = "1" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::同一次发布存在多个结果，无法确认构建目标"
            exit 1
          fi

      - name: 下载同一次运行的发布结果
        if: steps.result.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-result
          path: release-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 解析本次要上传的 tag
        id: tag
        if: github.event_name == 'workflow_dispatch' || steps.result.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TAG:-}" ]; then
            TARGET="${MANUAL_TAG}"
            echo "手动补传 tag=${TARGET}"
          else
            # 只接受触发运行自己的结果，不能用发布时间猜测并发运行创建的 release。
            TARGET="$(node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('release-result/release-result.json', 'utf8'));
          if (result.version !== 1 || result.run_id !== process.env.SOURCE_RUN_ID) {
            throw new Error('发布结果与触发运行不匹配');
          }
          if (result.tag !== null && (typeof result.tag !== 'string' || !/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(result.tag))) {
            throw new Error('发布结果中的 tag 无效');
          }
          process.stdout.write(result.tag ?? '');
          NODE
            )"
            if [ -z "${TARGET}" ]; then
              echo "本次没有产生新版本，跳过桌面版构建"
              exit 0
            fi
          fi

          # 两条路径都要过这道校验：上传目标的版本必须等于检出代码的版本。
          # 手动补传可能拿错代码，版本号取自目标 tag 的 backend/VERSION
          # （发版时由 scripts/sync-version.js 写入并随发版提交），产物文件名也带同一个
          # 版本号，所以版本对不上就绝不可能是「这次的构建」。
          if ! git cat-file -e "${TARGET}:backend/VERSION"; then
            echo "::error::检出的代码里没有 backend/VERSION，无法确认版本。该文件随 v1.31.0 之后才引入，补传更早的 release 需要手工处理。"
            exit 1
          fi
          VERSION="$(git show "${TARGET}:backend/VERSION" | tr -d '[:space:]')"
          if [ "v${VERSION}" != "${TARGET}" ]; then
            echo "::error::检出代码是 v${VERSION}，但上传目标是 ${TARGET}，版本不一致，拒绝上传"
            exit 1
          fi

          echo "上传目标 ${TARGET}（与检出代码 v${VERSION} 一致）"
          echo "tag=${TARGET}" >> "$GITHUB_OUTPUT"

      # 补传历史版本时会检出**还没有 macOS 支持**的旧 tag：那时 desktop/package.json
      # 的 pack/dist 还是 `electron-builder --win`，在 macOS 上只会产出 win-unpacked，
      # 后面的桌面版 E2E 必然失败、把整个 workflow 拖红。那种 tag 本来也不该挂 mac 产物，
      # 所以在这里就把 mac job 关掉（在 ubuntu 上判断，连 mac runner 都不会起）。
      - name: 确认该 tag 支持 macOS 打包
        id: mac
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          TARGET_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git show "${TARGET_TAG}:desktop/package.json" > "$RUNNER_TEMP/desktop-package.json"
          if grep -qE '"mac"[[:space:]]*:' "$RUNNER_TEMP/desktop-package.json"; then
            echo "该 tag 已支持 macOS 打包"
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "该 tag 的 desktop/package.json 里没有 mac 配置，跳过 macOS 构建（macOS 版从有这个配置的版本起才有）"
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: resolve-tag
    # 没有新版本时不构建（省掉一次十几分钟的 Windows 构建）
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: 安装依赖（旧 tag 保留原工具链）
        shell: bash
        run: |
          if [ -f frontend/vite.config.ts ] && [ -f uv.lock ]; then
            uv sync --locked --extra build
            pnpm install --frozen-lockfile
            if [ -f .venv/Scripts/python.exe ]; then
              echo "PYTHON=$PWD/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
            else
              echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
            fi
          else
            python -m pip install -r backend/requirements.txt -r desktop/requirements-build.txt
            echo "PYTHON=python" >> "$GITHUB_ENV"
          fi

      - name: 构建桌面版（前端 dist → 后端 exe → 安装包）
        shell: bash
        env:
          # 英文 Windows runner 的控制台代码页是 cp1252，Python 往 stdout 打中文会抛
          # UnicodeEncodeError。build.sh 自己也 export 了这两个（见 2026-09-29 那次
          # 失败），但手动补传检出的可能是**修复之前**的 tag —— 那时它的 build.sh 还是
          # 旧脚本，全靠这里兜住，否则补传历史版本会以同样的方式失败。
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: bash desktop/build.sh

      - name: 安装旧 tag 桌面版 E2E 依赖
        if: hashFiles('frontend/vite.config.ts') == ''
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      # 跑的是上一步刚构建出来的 win-unpacked（真实 Electron 外壳 + 后端 exe，
      # 和安装包里的文件是同一份），跑不过就不挂 Release。
      # _electron 驱动的是 Electron 二进制本身，不需要 playwright install 下载浏览器。
      - name: 桌面版 E2E（真实打包产物）
        working-directory: e2e
        shell: bash
        run: |
          if [ -f ../frontend/vite.config.ts ] && [ -f ../uv.lock ]; then
            pnpm run test:desktop
          else
            npm run test:desktop
          fi

      - name: 上传桌面版 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report-windows
          path: |
            e2e/desktop-tests/.report
            e2e/desktop-tests/.results
          # 这两个目录名以点开头，upload-artifact v4.4 起默认跳过隐藏文件 ——
          # 不加这一行，上传上去的是两个空目录
          include-hidden-files: true
          retention-days: 7

      - name: 挂到 Release 上
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        # 脚本内部按文件退避重试，扛 uploads.github.com 对 200MB 大文件偶发的 408
        run: bash scripts/upload-release-assets.sh "$TAG" 'desktop/build/installer/*.exe'

  build-desktop-mac:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.mac_supported == 'true'
    # 必须是 arm64 的 runner（macos-13 是 Intel）。PyInstaller 不能交叉编译，
    # 后端的架构由构建机决定，而 electron-builder 也只能给 mac 出 arm64 目标，
    # 所以 Intel 包得另开一个 macos-13 的 job 才行，目前没有。
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: 安装依赖（旧 tag 保留原工具链）
        shell: bash
        run: |
          if [ -f frontend/vite.config.ts ] && [ -f uv.lock ]; then
            uv sync --locked --extra build
            pnpm install --frozen-lockfile
            if [ -f .venv/Scripts/python.exe ]; then
              echo "PYTHON=$PWD/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
            else
              echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
            fi
          else
            python -m pip install -r backend/requirements.txt -r desktop/requirements-build.txt
            echo "PYTHON=python" >> "$GITHUB_ENV"
          fi

      - name: 构建桌面版（前端 dist → 后端可执行文件 → .app / DMG）
        shell: bash
        env:
          # 没有 Apple 开发者证书，明确别让 electron-builder 去找签名身份 ——
          # 找不到时它本来就只是警告后跳过，但显式关掉可以避免 runner 上装了别的
          # 证书时用错身份去签。package.json 里的 mac.identity: null 是第二道保险，
          # 而旧 tag 没有那个字段，只能靠这里。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bash desktop/build.sh

      - name: 安装旧 tag 桌面版 E2E 依赖
        if: hashFiles('frontend/vite.config.ts') == ''
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      # 驱动刚构建出来的 mac-arm64/Panache.app。未签名，但它是本机构建的、
      # 没有 quarantine 属性（只有从浏览器下载的文件才会被加上），所以能直接启动。
      - name: 桌面版 E2E（真实打包产物）
        working-directory: e2e
        shell: bash
        run: |
          if [ -f ../frontend/vite.config.ts ] && [ -f ../uv.lock ]; then
            pnpm run test:desktop
          else
            npm run test:desktop
          fi

      - name: 上传桌面版 E2E 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report-macos
          path: |
            e2e/desktop-tests/.report
            e2e/desktop-tests/.results
          include-hidden-files: true
          retention-days: 7

      - name: 挂到 Release 上
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        # DMG 和 zip 都是 200MB+，正是最容易撞 408 的那两个，务必走带重试的脚本
        run: bash scripts/upload-release-assets.sh "$TAG" 'desktop/build/installer/*.dmg' 'desktop/build/installer/*.zip'
