name: Engineering quality

on:
  push:
    branches: [custom-base]
  pull_request:
    branches: [custom-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed-path check plan and commit messages
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      python: ${{ steps.plan.outputs.python }}
      hooks: ${{ steps.plan.outputs.hooks }}
      unit_frontend: ${{ steps.plan.outputs.unit_frontend }}
      unit_python: ${{ steps.plan.outputs.unit_python }}
      unit_desktop: ${{ steps.plan.outputs.unit_desktop }}
      build: ${{ steps.plan.outputs.build }}
      e2e: ${{ steps.plan.outputs.e2e }}
      sw_upgrade: ${{ steps.plan.outputs.sw_upgrade }}
      docker: ${{ steps.plan.outputs.docker }}
      docs: ${{ steps.plan.outputs.docs }}
      desktop_e2e: ${{ steps.plan.outputs.desktop_e2e }}
      has_quality: ${{ steps.matrix.outputs.has_quality }}
      quality_os: ${{ steps.matrix.outputs.quality_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Plan checks from actual Git paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/plan-checks.cjs --ci --output preview_outputs/change-plan.json
      - name: Select necessary quality runners
        id: matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('preview_outputs/change-plan.json', 'utf8'));
          const crossPlatform = ['frontend', 'python', 'hooks', 'unit_frontend', 'unit_python', 'unit_desktop'].some(key => plan[key]);
          const hasQuality = crossPlatform || ['build', 'e2e', 'sw_upgrade'].some(key => plan[key]);
          const platforms = crossPlatform ? ['ubuntu-latest', 'windows-latest'] : ['ubuntu-latest'];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_quality=${hasQuality}\nquality_os=${JSON.stringify(platforms)}\n`);
          NODE
      - name: Validate new commit messages
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
              node scripts/check-commit-message.cjs --range "$PR_BASE..$PR_HEAD"
            else
              node scripts/check-commit-message.cjs --range "$PR_HEAD"
            fi
          elif git cat-file -e "${PUSH_BASE}^{commit}" 2>/dev/null; then
            node scripts/check-commit-message.cjs --range "$PUSH_BASE..$HEAD_SHA"
          else
            node scripts/check-commit-message.cjs --range "$HEAD_SHA"
          fi
      - name: Preserve exact-run release eligibility
        uses: actions/upload-artifact@v4
        with:
          name: changed-path-plan
          path: preview_outputs/change-plan.json
          if-no-files-found: error
          retention-days: 30

  quality:
    needs: changes
    if: needs.changes.outputs.has_quality == 'true'
    name: Quality and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.quality_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      SENTRY_DSN: ""
      NEEDS_NODE: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.hooks == 'true' || needs.changes.outputs.unit_frontend == 'true' || needs.changes.outputs.unit_desktop == 'true' || (matrix.os == 'ubuntu-latest' && (needs.changes.outputs.build == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.sw_upgrade == 'true')) }}
      NEEDS_PYTHON: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.unit_python == 'true' || (matrix.os == 'ubuntu-latest' && needs.changes.outputs.e2e == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: env.NEEDS_NODE == 'true'
      - uses: actions/setup-node@v4
        if: env.NEEDS_NODE == 'true'
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        if: env.NEEDS_PYTHON == 'true'
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux' && (needs.changes.outputs.unit_python == 'true' || needs.changes.outputs.e2e == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install locked JavaScript dependencies
        if: env.NEEDS_NODE == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install locked Python dependencies
        if: env.NEEDS_PYTHON == 'true'
        run: uv sync --locked --extra dev
      - name: Frontend strict quality
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm run quality:frontend
      - name: Python strict quality
        if: needs.changes.outputs.python == 'true'
        run: uv run --locked --extra dev ruff check . && uv run --locked --extra dev ruff format --check . && uv run --locked --extra dev pyright
      - name: Hook and planner regression tests
        if: needs.changes.outputs.hooks == 'true'
        run: pnpm run test:hooks
      - name: Validate workflow syntax and expressions
        if: runner.os == 'Linux' && needs.changes.outputs.hooks == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck=
      - name: Frontend unit tests
        if: needs.changes.outputs.unit_frontend == 'true'
        run: pnpm run test:frontend
      - name: Desktop storage unit tests
        if: needs.changes.outputs.unit_desktop == 'true'
        run: pnpm run test:desktop-storage
      - name: Backend unit tests
        if: needs.changes.outputs.unit_python == 'true'
        run: uv run --locked --extra dev python -m pytest backend/tests
      - name: Frontend production build
        if: runner.os == 'Linux' && needs.changes.outputs.build == 'true'
        run: pnpm --filter handwrite run build
      - name: Install Chromium
        if: runner.os == 'Linux' && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.sw_upgrade == 'true')
        run: pnpm --filter handwriting-web-e2e exec playwright install --with-deps chromium
      - name: Legacy service worker retirement regression
        if: runner.os == 'Linux' && needs.changes.outputs.sw_upgrade == 'true'
        run: pnpm run test:sw-upgrade
      - name: Browser E2E
        if: runner.os == 'Linux' && needs.changes.outputs.e2e == 'true'
        run: pnpm --filter handwriting-web-e2e run test
      - name: Upload browser report
        if: always() && runner.os == 'Linux' && needs.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engineering-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker images and deployed generation
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CPU_USAGE_LIMIT: "100"
      DOCKER_SMOKE_OUTPUT: preview_outputs/docker-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Validate and build current branch images
        run: |
          docker compose config --quiet
          docker compose build frontend backend
      - name: Start current branch containers
        run: docker compose up -d --no-build frontend backend
      - name: Verify deployed SPA, API, PNG and unified logs
        run: bash scripts/smoke-docker-compose.sh
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p preview_outputs/docker-smoke
          docker compose ps -a > preview_outputs/docker-smoke/containers.txt
          docker compose logs --no-color > preview_outputs/docker-smoke/compose.log 2>&1
      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke
          path: preview_outputs/docker-smoke
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  docs:
    name: Documentation build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-static-i18n
      - run: mkdocs build --strict

  desktop:
    name: Windows packaged desktop regression
    needs: changes
    if: needs.changes.outputs.desktop_e2e == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install runtime, test and packaging dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --extra dev --extra build
      - name: Build packaged desktop application
        shell: bash
        run: bash desktop/build.sh --app-only --skip-deps
      - name: Test packaged desktop application
        run: pnpm --filter handwriting-web-e2e run test:desktop
      - name: Upload packaged desktop report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-desktop-report-windows
          path: |
            e2e/desktop-tests/.report
            e2e/desktop-tests/.results
          include-hidden-files: true
          retention-days: 7

  gate:
    name: Engineering quality gate
    needs: [changes, quality, docker, docs, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const checks = JSON.parse(process.env.CHECK_RESULTS);
          if (checks.changes.result !== 'success') throw new Error('Changed-path planning or commit-message validation failed.');
          const required = {
            quality: checks.changes.outputs.has_quality,
            docker: checks.changes.outputs.docker,
            docs: checks.changes.outputs.docs,
            desktop: checks.changes.outputs.desktop_e2e,
          };
          for (const [name, selected] of Object.entries(required)) {
            if (!['true', 'false'].includes(selected)) throw new Error(`Missing check selection for ${name}.`);
            if (!['success', 'skipped'].includes(checks[name].result)) {
              throw new Error(`${name} check failed or was cancelled: ${checks[name].result}`);
            }
            if (selected === 'true' && checks[name].result !== 'success') {
              throw new Error(`Required ${name} check did not succeed: ${checks[name].result}`);
            }
          }
          console.log('All checks selected by actual changed paths passed.');
          NODE
