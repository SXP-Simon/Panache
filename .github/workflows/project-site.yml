name: Publish project site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/images/**"
      - "app/assets/fonts/PlayfairDisplay.ttf"
      - "app/assets/branding/panache.png"
      - "app/assets/support/wechat-tip.jpg"
      - "assets/licenses/PlayfairDisplay-OFL.txt"
      - ".github/workflows/project-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r website/requirements.txt
      - run: python website/build.py --out "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
