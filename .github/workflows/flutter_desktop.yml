name: Flutter 独立桌面客户端
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    paths:
      - "VERSION"
      - "app/**"
      - "vendor/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/pubspec.yaml"
      - "LICENSE"
      - "scripts/build-flutter-desktop.py"
      - "scripts/windows_launcher.py"
      - "scripts/tests/test_desktop_release_version.py"
      - "scripts/tests/test_windows_launcher.py"
      - "scripts/embed-macos-backend.sh"
      - ".github/workflows/flutter_desktop.yml"
      - "!**/*.md"
      - "assets/licenses/**"
      - "assets/font_assets/**"
      - "crates/*/licenses/**"
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'run-ci' && github.event.sender.type == 'User')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - if: runner.os == 'macOS'
        run: flutter build macos --debug
        working-directory: app
      - run: python scripts/build-flutter-desktop.py
      - name: 验证随包 MCP 的预览、导出和历史恢复
        shell: bash
        run: |
          python -m pip install "mcp>=1.12,<2" Pillow
          if [[ "$RUNNER_OS" == Windows ]]; then
            python crates/panache-mcp/tests/smoke.py target/desktop-package/windows/Panache/handwriting_app.exe --server-arg=--mcp
            python crates/panache-mcp/tests/context_metrics.py target/desktop-package/windows/Panache/handwriting_app.exe --mcp
          else
            binary=$(find target/desktop-package -type f -name panache-mcp -print -quit)
            python crates/panache-mcp/tests/smoke.py "$binary"
            python crates/panache-mcp/tests/context_metrics.py "$binary"
          fi
      - name: Flutter 检查
        working-directory: app
        run: flutter analyze
      - name: 内置进程集成测试
        shell: bash
        run: |
          BINARY=$(find target/desktop-package -type f \( -name handwriting-server -o -name handwriting-server.exe \) -print -quit)
          BINARY=$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve())' "$BINARY")
          cd app
          flutter test --dart-define="DESKTOP_BACKEND_EXECUTABLE=$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: handwriting-flutter-${{ matrix.os }}
          path: |
            target/desktop-package/**/*.zip
            target/desktop-package/**/*.tar.gz
