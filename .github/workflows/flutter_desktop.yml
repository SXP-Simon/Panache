name: Flutter 独立桌面客户端
on:
  workflow_dispatch:
  pull_request:
    paths: ["VERSION", "app/**", "crates/**", "Cargo.toml", "Cargo.lock", "assets/font_assets/**", "assets/pubspec.yaml", "assets/licenses/**", "LICENSE", "scripts/build-flutter-desktop.py", "scripts/windows_launcher.py", "scripts/tests/test_desktop_release_version.py", "scripts/tests/test_windows_launcher.py", "scripts/embed-macos-backend.sh", ".github/workflows/flutter_desktop.yml"]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - if: runner.os == 'macOS'
        run: flutter build macos --debug
        working-directory: app
      - run: python scripts/build-flutter-desktop.py
      - name: Flutter 检查
        working-directory: app
        run: flutter analyze
      - name: 内置进程集成测试
        shell: bash
        run: |
          BINARY=$(find target/desktop-package -type f \( -name handwriting-server -o -name handwriting-server.exe \) -print -quit)
          BINARY=$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve())' "$BINARY")
          cd app
          flutter test --dart-define="DESKTOP_BACKEND_EXECUTABLE=$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: handwriting-flutter-${{ matrix.os }}
          path: |
            target/desktop-package/**/*.zip
            target/desktop-package/**/*.tar.gz
