name: Check Markdown-only PR update
on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
    outputs:
      skip:
        value: ${{ jobs.compare.outputs.skip }}
jobs:
  compare:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - run: node --test .github/scripts/markdown-update.test.cjs
      - name: Check the update against the previous verified revision
        id: check
        uses: actions/github-script@v7
        env:
          CALLER_WORKFLOW: ${{ inputs.workflow }}
        with:
          script: |
            const skip = require('./.github/scripts/markdown-update.cjs');
            return await skip({ github, context, core }, process.env.CALLER_WORKFLOW);
