name: Deploy Docs

on:
  push:
    branches: [custom-base]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # docs/changelog.md 直接嵌入根目录的 CHANGELOG.md，所以它变了要重新构建
      - "CHANGELOG.md"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 构建只读取源码和 Pages 配置，部署写权限留给 deploy job。
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认会把 GITHUB_TOKEN 写进 .git/config 供后续步骤使用，
          # 这里不推代码，没必要留着给构建期的第三方代码读。
          persist-credentials: false

      - name: Verify GitHub Pages configuration
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install mkdocs-material mkdocs-static-i18n

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 只有这一层需要发布权限
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
