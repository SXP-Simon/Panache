name: Flutter UI

on:
  pull_request:
    paths: ["app/**", "backend/pubspec.yaml", "backend/font_assets/**", "scripts/build-flutter-web.sh", ".github/workflows/flutter.yml"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build web --release
        working-directory: app
