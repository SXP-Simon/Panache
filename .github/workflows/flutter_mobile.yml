name: Flutter Mobile
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0} · base {1}', github.event.pull_request.number, github.event.pull_request.base.sha) || github.workflow }}
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "VERSION"
      - "app/**"
      - "scripts/*release*.*"
      - "scripts/tests/test-flutter-release.cjs"
      - ".github/workflows/publish_flutter.yml"
      - "vendor/**"
      - "crates/**"
      - "Cargo.*"
      - "assets/pubspec.yaml"
      - "LICENSE"
      - "scripts/build-mobile-engine.py"
      - ".github/scripts/markdown-update*.cjs"
      - ".github/workflows/markdown-update.yml"
      - ".github/workflows/flutter_mobile.yml"
      - "!**/*.md"
      - "assets/licenses/**"
      - "assets/font_assets/**"
      - "crates/*/licenses/**"
  workflow_dispatch:
jobs:
  markdown-update:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/markdown-update.yml
    with:
      workflow: flutter_mobile.yml
  android:
    needs: markdown-update
    if: ${{ !cancelled() && needs.markdown-update.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Free space for Android, Rust and emulator builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: dart pub get
        working-directory: app/updater
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: app
      - run: flutter build apk --release --target-platform android-arm64,android-x64
        working-directory: app
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd app && flutter test integration_test/mobile_engine_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
