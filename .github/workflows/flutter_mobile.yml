name: Flutter Mobile
on:
  push:
    branches: ["flutter"]
    paths: ["VERSION", "app/**", "crates/**", "Cargo.*", "assets/pubspec.yaml", "assets/licenses/**", "LICENSE", "assets/font_assets/**", "scripts/build-mobile-engine.py", ".github/workflows/flutter_mobile.yml"]
  pull_request:
    paths: ["VERSION", "app/**", "crates/**", "Cargo.*", "assets/pubspec.yaml", "assets/licenses/**", "LICENSE", "assets/font_assets/**", "scripts/build-mobile-engine.py", ".github/workflows/flutter_mobile.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: app
      - run: flutter build apk --release --target-platform android-arm64,android-x64
        working-directory: app
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd app && flutter test integration_test/mobile_engine_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: flutter pub get && flutter build ios --simulator --debug
        working-directory: app
      - name: iOS 模拟器离线集成测试
        working-directory: app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          flutter test integration_test/mobile_engine_test.dart -d "$DEVICE"
      - run: flutter build ios --release --no-codesign
        working-directory: app
