name: Backend Test Workflow

on:
  # Automatic checks are part of Engineering quality.
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --locked --extra dev
      - name: Run unit tests
        run: uv run --locked --extra dev python -m pytest backend/tests -q
      - name: Smoke-test app boot
        working-directory: backend
        run: uv run --project .. --locked bash smoke_boot.sh
